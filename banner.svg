<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rachael Muthoni Njeru, Data Science and Computer Science Student" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="0.55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbcfe8"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <path id="spark" d="M0,-11 L2.6,-2.6 L11,0 L2.6,2.6 L0,11 L-2.6,2.6 L-11,0 L-2.6,-2.6 Z"/>
  </defs>

  <rect width="1000" height="260" rx="20" fill="url(#bg)"/>

  <!-- soft floating glows -->
  <circle cx="180" cy="60" r="70" fill="#f9a8d4" opacity="0.35" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 40,25; 0,0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="200" r="85" fill="#c084fc" opacity="0.4" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -45,-20; 0,0" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling sparkles -->
  <g fill="#fdf2f8">
    <use href="#spark" x="90" y="190" opacity="0.8">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="250" y="48" opacity="0.8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="760" y="55" opacity="0.8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="905" y="120" opacity="0.8">
      <animate attributeName="opacity" values="1;0.15;1" dur="3s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="640" y="218" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- text -->
  <text x="500" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="url(#title)">Rachael Muthoni Njeru</text>
  <text x="500" y="160" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3" fill="#fdf2f8">DATA SCIENCE &amp; COMPUTER SCIENCE STUDENT</text>
  <line x1="420" y1="182" x2="580" y2="182" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <text x="500" y="212" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e9d5ff">Machine Learning  •  Data Modeling  •  Backend Systems</text>
</svg>
